<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YejuBingo Telegram Mini App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #171b22;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 0;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #171b22;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header Bar */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: #171b22;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
        }

        .title {
            font-size: 19px;
            font-weight: 600;
            color: #ffffff;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .dropdown-arrow {
            background: none;
            border: none;
            color: #a0aec0;
            font-size: 16px;
            cursor: pointer;
        }

        .menu-dots {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
        }

        /* Top Badges Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr 0.9fr 1.3fr;
            gap: 6px;
            padding: 8px 12px 14px 12px;
            background: #171b22;
        }

        .stat-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 4px;
            border-radius: 10px;
            font-size: 11px;
            height: 44px;
        }

        .badge-room {
            background: #fbc02d;
            color: #1a1e29;
            font-weight: 800;
            font-size: 12px;
        }

        .badge-sold {
            background: #262d3d;
            color: #ffffff;
            border: 1px solid #323b4e;
        }

        .badge-time {
            background: #262d3d;
            color: #ff5252;
            border: 1px solid #323b4e;
        }

        .badge-balance {
            background: #00c853;
            color: #ffffff;
            font-weight: 700;
        }

        .stat-label {
            font-size: 9px;
            text-transform: uppercase;
            font-weight: 700;
            opacity: 0.9;
            margin-bottom: 1px;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 12px;
            font-weight: 700;
        }

        /* Grid Section Container */
        .grid-wrapper {
            background: #e4e7ed;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 12px 8px;
            flex: 1;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.1);
        }

        .grid-container {
            max-height: 440px;
            overflow-y: auto;
            padding: 4px;
        }

        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 6px;
        }

        .number-cell {
            background: #ffffff;
            color: #2d3748;
            border-radius: 6px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
            transition: all 0.1s ease;
        }

        /* ሲመረጥ ግራጫማ እንዲሆን */
        .number-cell.selected {
            background: #d0d5dd;
            color: #667085;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.15);
            transform: scale(0.96);
        }

        /* Slots Section at the bottom */
        .slots-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 16px;
            background: #ffffff;
            color: #2d3748;
            border-top: 1px solid #dcdfe6;
        }

        .slot-box {
            border: 2px dashed #cbd5e0;
            border-radius: 12px;
            padding: 16px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 85px;
            background: #f7fafc;
            cursor: pointer;
            position: relative;
        }

        .slot-box.filled {
            border-style: solid;
            border-color: #3182ce;
            background: #ebf8ff;
        }

        .slot-icon {
            font-size: 22px;
            color: #a0aec0;
            margin-bottom: 2px;
        }

        .slot-text {
            font-size: 10px;
            font-weight: 700;
            color: #718096;
            text-align: center;
            text-transform: uppercase;
        }

        .slot-card-number {
            font-size: 15px;
            font-weight: 800;
            color: #2b6cb0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <button class="close-btn">&#10005;</button>
                <div class="title">YejuBingo</div>
            </div>
            <div class="header-right">
                <button class="dropdown-arrow">&#9660;</button>
                <button class="menu-dots">&#8942;</button>
            </div>
        </div>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-badge badge-room">
                <span class="stat-label" style="color: #6b4f00;">ROOM</span>
                <span class="stat-value">VIP 💰</span>
            </div>
            <div class="stat-badge badge-sold" id="sold-badge">
                <span class="stat-label" style="color: #94a3b8;">SOLD</span>
                <span class="stat-value" id="sold-count">0</span>
            </div>
            <div class="stat-badge badge-time">
                <span class="stat-label" style="color: #94a3b8;">TIME</span>
                <span class="stat-value" id="timer">29s</span>
            </div>
            <div class="stat-badge badge-balance">
                <span class="stat-label" style="color: #e2fccf;">BALANCE</span>
                <span class="stat-value" id="balance-amount">50.00 ETB</span>
            </div>
        </div>

        <!-- Numbers Grid (1 to 250) -->
        <div class="grid-wrapper">
            <div class="grid-container">
                <div class="numbers-grid" id="numbersGrid">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>

        <!-- Slots Section -->
        <div class="slots-section">
            <div class="slot-box" id="slot1" onclick="clearSlot(1)">
                <div class="slot-icon" id="slot1-icon">+</div>
                <div class="slot-text" id="slot1-text">SLOT 1 EMPTY</div>
            </div>
            <div class="slot-box" id="slot2" onclick="clearSlot(2)">
                <div class="slot-icon" id="slot2-icon">+</div>
                <div class="slot-text" id="slot2-text">SLOT 2 EMPTY</div>
            </div>
        </div>
    </div>

    <script>
        let soldCount = 0; // ከ 0 ጀምሮ እንዲቆጥር ተደርጓል
        let timeLeft = 29;
        let balance = 50.00; // ለሙከራ እንዲመች የተሰጠ Balace (ከ 0 በላይ መሆን አለበት)
        const cardPrice = 10.00; // የአንድ ካርድ ዋጋ
        let selectedCards = [];

        const gridEl = document.getElementById('numbersGrid');
        for (let i = 1; i <= 250; i++) { // ብዛቱ ወደ 250 ከፍ ብሏል
            const cell = document.createElement('div');
            cell.className = 'number-cell';
            cell.innerText = i;
            cell.dataset.number = i;

            cell.addEventListener('click', () => toggleSelect(i, cell));
            gridEl.appendChild(cell);
        }

        // Timer countdown
        setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft + 's';
            }
        }, 1000);

        function toggleSelect(num, cell) {
            const index = selectedCards.indexOf(num);
            if (index > -1) {
                // መምረጡን ከሰረዘው (Deselect)
                selectedCards.splice(index, 1);
                cell.classList.remove('selected');
                balance += cardPrice; // ገንዘቡን መልሶ ይጨምራል
                soldCount--;
            } else {
                // 2. ባላንስ ዜሮ ወይም ከእሱ በታች (ኔጌቲቭ) ከሆነ እንዳይመርጥ ይከለክላል
                if (balance <= 0) {
                    alert('ባላንስዎ ስለተጠናቀቀ ወይም ዜሮ ስለሆነ ተጨማሪ ካርድ መምረጥ አይችሉም!');
                    return;
                }
                if (selectedCards.length >= 2) {
                    alert('ከሁለት በላይ ካርድ መምረጥ አይችሉም!');
                    return;
                }
                selectedCards.push(num);
                cell.classList.add('selected');
                balance -= cardPrice; // ከባላንስ ይቀንሳል
                soldCount++;
            }
            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById('sold-count').innerText = soldCount;
            document.getElementById('balance-amount').innerText = balance.toFixed(2) + ' ETB';

            // Slot 1
            const s1Box = document.getElementById('slot1');
            const s1Icon = document.getElementById('slot1-icon');
            const s1Text = document.getElementById('slot1-text');
            if (selectedCards.length > 0) {
                s1Box.classList.add('filled');
                s1Icon.style.display = 'none';
                s1Text.innerHTML = `SLOT 1<br><span class="slot-card-number">CARD #${selectedCards[0]}</span>`;
            } else {
                s1Box.classList.remove('filled');
                s1Icon.style.display = 'block';
                s1Icon.innerText = '+';
                s1Text.innerText = 'SLOT 1 EMPTY';
            }

            // Slot 2
            const s2Box = document.getElementById('slot2');
            const s2Icon = document.getElementById('slot2-icon');
            const s2Text = document.getElementById('slot2-text');
            if (selectedCards.length > 1) {
                s2Box.classList.add('filled');
                s2Icon.style.display = 'none';
                s2Text.innerHTML = `SLOT 2<br><span class="slot-card-number">CARD #${selectedCards[1]}</span>`;
            } else {
                s2Box.classList.remove('filled');
                s2Icon.style.display = 'block';
                s2Icon.innerText = '+';
                s2Text.innerText = 'SLOT 2 EMPTY';
            }
        }

        function clearSlot(slotNum) {
            if (slotNum === 1 && selectedCards.length > 0) {
                const removed = selectedCards.shift();
                const cell = document.querySelector(`[data-number='${removed}']`);
                if(cell) cell.classList.remove('selected');
                balance += cardPrice;
                soldCount--;
            } else if (slotNum === 2 && selectedCards.length > 1) {
                const removed = selectedCards.pop();
                const cell = document.querySelector(`[data-number='${removed}']`);
                if(cell) cell.classList.remove('selected');
                balance += cardPrice;
                soldCount--;
            }
            updateDisplay();
        }
    </script>
</body>
</html>
