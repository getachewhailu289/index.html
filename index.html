<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoodBingo Telegram Mini App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #1a1e29;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #242938;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #333a4d;
        }

        /* Header Bar */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #1f2430;
            border-bottom: 1px solid #2f374a;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #a0aec0;
            font-size: 20px;
            cursor: pointer;
        }

        .title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-dots {
            background: none;
            border: none;
            color: #a0aec0;
            font-size: 20px;
            cursor: pointer;
        }

        /* Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: 1fr 1fr 1.2fr;
            gap: 8px;
            padding: 12px 16px;
            background: #1f2430;
            border-bottom: 1px solid #2f374a;
        }

        .stat-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 8px;
            border-radius: 10px;
            font-size: 12px;
        }

        .badge-room {
            background: linear-gradient(135deg, #f6ad55, #ed8936);
            color: #1a1e29;
            font-weight: 800;
        }

        .badge-sold {
            background: #2d3748;
            color: #e2e8f0;
            border: 1px solid #4a5568;
        }

        .badge-time {
            background: #2d3748;
            color: #feb2b2;
            border: 1px solid #4a5568;
        }

        .badge-balance {
            background: #276749;
            color: #9ae6b4;
            border: 1px solid #38a169;
            font-weight: 700;
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            opacity: 0.8;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 14px;
            font-weight: 700;
        }

        /* Grid Section */
        .grid-container {
            padding: 12px;
            background: #eaedf4;
            max-height: 420px;
            overflow-y: auto;
            border-bottom: 1px solid #d2d6dc;
        }

        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 6px;
        }

        .number-cell {
            background: #ffffff;
            color: #2d3748;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .number-cell.selected {
            background: #3182ce;
            color: #ffffff;
            border-color: #2b6cb0;
            box-shadow: 0 0 8px rgba(49, 130, 206, 0.6);
            transform: scale(1.05);
        }

        /* Slots Section */
        .slots-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 16px;
            background: #ffffff;
            color: #2d3748;
        }

        .slot-box {
            border: 2px dashed #cbd5e0;
            border-radius: 12px;
            padding: 16px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90px;
            background: #f7fafc;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .slot-box:hover {
            border-color: #3182ce;
            background: #ebf8ff;
        }

        .slot-box.filled {
            border-style: solid;
            border-color: #3182ce;
            background: #ebf8ff;
        }

        .slot-icon {
            font-size: 20px;
            color: #a0aec0;
            margin-bottom: 4px;
        }

        .slot-text {
            font-size: 11px;
            font-weight: 700;
            color: #718096;
            text-align: center;
            text-transform: uppercase;
        }

        .slot-card-number {
            font-size: 16px;
            font-weight: 800;
            color: #2b6cb0;
        }

        /* Bottom Controls */
        .footer-actions {
            padding: 12px 16px;
            background: #f7fafc;
            display: flex;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary {
            background: #3182ce;
            color: white;
        }

        .btn-primary:hover {
            background: #2b6cb0;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <button class="close-btn">&#10005;</button>
                <div class="title">GoodBingo</div>
            </div>
            <div class="header-right">
                <button class="menu-dots">&#8942;</button>
            </div>
        </div>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-badge badge-room">
                <span class="stat-label" style="color: #744210;">ROOM</span>
                <span class="stat-value">VIP 💰</span>
            </div>
            <div class="stat-badge badge-sold" id="sold-badge">
                <span class="stat-label">SOLD</span>
                <span class="stat-value" id="sold-count">13</span>
            </div>
            <div class="stat-badge badge-time">
                <span class="stat-label">TIME</span>
                <span class="stat-value" id="timer">27s</span>
            </div>
            <!-- Balance Badge -->
            <div class="stat-badge badge-balance" style="grid-column: span 3; margin-top: 4px; display: flex; flex-direction: row; justify-content: space-between; padding: 8px 12px;">
                <span>BALANCE:</span>
                <span id="balance-amount">100.00 ETB</span>
            </div>
        </div>

        <!-- Numbers Grid (1 to 104) -->
        <div class="grid-container">
            <div class="numbers-grid" id="numbersGrid">
                <!-- Dynamically populated -->
            </div>
        </div>

        <!-- Slots Section -->
        <div class="slots-section">
            <div class="slot-box" id="slot1" onclick="clearSlot(1)">
                <div class="slot-icon" id="slot1-icon">+</div>
                <div class="slot-text" id="slot1-text">SLOT 1 EMPTY</div>
            </div>
            <div class="slot-box" id="slot2" onclick="clearSlot(2)">
                <div class="slot-icon" id="slot2-icon">+</div>
                <div class="slot-text" id="slot2-text">SLOT 2 EMPTY</div>
            </div>
        </div>

        <!-- Action Footer -->
        <div class="footer-actions">
            <button class="btn-action btn-secondary" onclick="resetSelection()">አጽዳ (Reset)</button>
            <button class="btn-action btn-primary" onclick="confirmCards()">ካርድ ግዛ (Buy)</button>
        </div>
    </div>

    <script>
        let soldCount = 13;
        let timeLeft = 27;
        let balance = 100.00; // Starting Balance
        const cardPrice = 10.00; // Price per card
        let selectedCards = [];

        // Generate grid 1 to 104 - all active and clickable
        const gridEl = document.getElementById('numbersGrid');
        for (let i = 1; i <= 104; i++) {
            const cell = document.createElement('div');
            cell.className = 'number-cell';
            cell.innerText = i;
            cell.dataset.number = i;

            cell.addEventListener('click', () => toggleSelect(i, cell));
            gridEl.appendChild(cell);
        }

        // Timer countdown
        setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft + 's';
            }
        }, 1000);

        function toggleSelect(num, cell) {
            const index = selectedCards.indexOf(num);
            if (index > -1) {
                // Deselecting -> refund balance and decrease sold count
                selectedCards.splice(index, 1);
                cell.classList.remove('selected');
                balance += cardPrice;
                soldCount--;
            } else {
                if (selectedCards.length >= 2) {
                    alert('ከሁለት በላይ ካርድ መምረጥ አይችሉም! (Max 2 cards)');
                    return;
                }
                if (balance < cardPrice) {
                    alert('በቂ ባላንስ የለዎትም! (Insufficient Balance)');
                    return;
                }
                selectedCards.push(num);
                cell.classList.add('selected');
                balance -= cardPrice;
                soldCount++;
            }
            updateDisplay();
        }

        function updateDisplay() {
            // Update Sold Count & Balance
            document.getElementById('sold-count').innerText = soldCount;
            document.getElementById('balance-amount').innerText = balance.toFixed(2) + ' ETB';

            // Slot 1
            const s1Box = document.getElementById('slot1');
            const s1Icon = document.getElementById('slot1-icon');
            const s1Text = document.getElementById('slot1-text');
            if (selectedCards.length > 0) {
                s1Box.classList.add('filled');
                s1Icon.style.display = 'none';
                s1Text.innerHTML = `SLOT 1<br><span class="slot-card-number">CARD #${selectedCards[0]}</span>`;
            } else {
                s1Box.classList.remove('filled');
                s1Icon.style.display = 'block';
                s1Icon.innerText = '+';
                s1Text.innerText = 'SLOT 1 EMPTY';
            }

            // Slot 2
            const s2Box = document.getElementById('slot2');
            const s2Icon = document.getElementById('slot2-icon');
            const s2Text = document.getElementById('slot2-text');
            if (selectedCards.length > 1) {
                s2Box.classList.add('filled');
                s2Icon.style.display = 'none';
                s2Text.innerHTML = `SLOT 2<br><span class="slot-card-number">CARD #${selectedCards[1]}</span>`;
            } else {
                s2Box.classList.remove('filled');
                s2Icon.style.display = 'block';
                s2Icon.innerText = '+';
                s2Text.innerText = 'SLOT 2 EMPTY';
            }
        }

        function clearSlot(slotNum) {
            if (slotNum === 1 && selectedCards.length > 0) {
                const removed = selectedCards.shift();
                const cell = document.querySelector(`[data-number='${removed}']`);
                if(cell) cell.classList.remove('selected');
                balance += cardPrice;
                soldCount--;
            } else if (slotNum === 2 && selectedCards.length > 1) {
                const removed = selectedCards.pop();
                const cell = document.querySelector(`[data-number='${removed}']`);
                if(cell) cell.classList.remove('selected');
                balance += cardPrice;
                soldCount--;
            }
            updateDisplay();
        }

        function resetSelection() {
            selectedCards.forEach(num => {
                const cell = document.querySelector(`[data-number='${num}']`);
                if(cell) cell.classList.remove('selected');
                balance += cardPrice;
                soldCount--;
            });
            selectedCards = [];
            updateDisplay();
        }

        function confirmCards() {
            if (selectedCards.length === 0) {
                alert('እባክዎ ቢያንስ አንድ ካርድ ይምረጡ!');
                return;
            }
            alert('በሳክሰስ ተገዝቷል! ካርድ ቁጥር: ' + selectedCards.join(', '));
            selectedCards = [];
            updateDisplay();
        }
    </script>
</body>
</html>
