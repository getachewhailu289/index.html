<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YejuBingo Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #171b22; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; background: #171b22; display: flex; flex-direction: column; min-height: 100vh; }
        .page { display: none; flex-direction: column; flex: 1; width: 100%; }
        .page.active { display: flex; }
        .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #171b22; }
        .close-btn, .dropdown-arrow, .menu-dots { background: none; border: none; color: #ffffff; font-size: 20px; cursor: pointer; }
        .title { font-size: 19px; font-weight: 600; color: #ffffff; }
        .stats-bar { display: grid; grid-template-columns: 1.1fr 0.9fr 0.9fr 1.3fr; gap: 6px; padding: 8px 12px 14px 12px; background: #171b22; }
        .stat-badge { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 4px; border-radius: 10px; font-size: 11px; height: 44px; }
        .badge-room { background: #fbc02d; color: #1a1e29; font-weight: 800; }
        .badge-sold { background: #262d3d; color: #ffffff; border: 1px solid #323b4e; }
        .badge-time { background: #262d3d; color: #ff5252; border: 1px solid #323b4e; }
        .badge-balance { background: #00c853; color: #ffffff; font-weight: 700; }
        .stat-label { font-size: 9px; text-transform: uppercase; font-weight: 700; opacity: 0.9; margin-bottom: 1px; }
        .stat-value { font-size: 12px; font-weight: 700; }
        .grid-wrapper { background: #e4e7ed; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 12px 8px; flex: 1; }
        .grid-container { max-height: 310px; overflow-y: auto; padding: 4px; }
        .numbers-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
        .number-cell { background: #ffffff; color: #2d3748; border-radius: 6px; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; cursor: pointer; user-select: none; }
        .number-cell.selected { background: #3182ce; color: #ffffff; transform: scale(0.96); }
        .slots-section { display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; background: #ffffff; color: #2d3748; border-top: 1px solid #dcdfe6; }
        .slots-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .slot-box { border: 2px dashed #cbd5e0; border-radius: 10px; padding: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 110px; background: #f7fafc; cursor: pointer; position: relative; }
        .slot-box.filled { border-style: solid; border-color: #3182ce; background: #ebf8ff; }
        .slot-icon { font-size: 20px; color: #a0aec0; margin-bottom: 2px; }
        .slot-text { font-size: 8px; font-weight: 700; color: #718096; text-align: center; text-transform: uppercase; margin-bottom: 3px; }
        .mini-matrix-wrapper { width: 100%; max-width: 125px; }
        .mini-matrix-header { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; margin-bottom: 1px; text-align: center; font-weight: 900; font-size: 8px; color: #ffffff; }
        .mmh-b { background: #2196f3; } .mmh-i { background: #f44336; } .mmh-n { background: #ff9800; } .mmh-g { background: #4caf50; } .mmh-o { background: #9c27b0; }
        .mini-matrix { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; width: 100%; }
        .matrix-cell { background: #ffffff; color: #1a202c; font-size: 7px; font-weight: 700; text-align: center; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border: 1px solid #cbd5e0; }
        .matrix-cell.free-cell { background: #ecc94b; color: #744210; }
        .game-header-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 8px 16px; background: #171b22; text-align: center; font-size: 11px; font-weight: 700; color: #94a3b8; }
        .game-header-stats span { display: block; font-size: 13px; color: #ffffff; }
        .game-body { display: flex; flex: 1; background: #e4e7ed; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 8px; gap: 8px; overflow: hidden; }
        .balls-table-container { width: 48%; background: #ffffff; border-radius: 10px; padding: 6px; max-height: 520px; overflow-y: auto; }
        .bingo-header-row { display: grid; grid-template-columns: repeat(5, 1fr); text-align: center; font-weight: 900; font-size: 11px; margin-bottom: 4px; color: #ffffff; }
        .bh-b { background: #2196f3; } .bh-i { background: #f44336; } .bh-n { background: #ff9800; } .bh-g { background: #4caf50; } .bh-o { background: #9c27b0; }
        .balls-grid-1-75 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
        .b-cell { background: #f7fafc; border: 1px solid #e2e8f0; text-align: center; font-size: 10px; font-weight: 700; color: #2d3748; padding: 5px 0; border-radius: 3px; }
        .b-cell.called { background: #3182ce; color: #ffffff; }
        .game-main-area { flex: 1; display: flex; flex-direction: column; padding: 6px; background: #d8dbe2; border-radius: 10px; gap: 8px; overflow-y: auto; }
        .recent-balls-bar { width: 100%; background: #ffffff; padding: 6px; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #cbd5e0; }
        .recent-ball-tag { font-size: 9px; font-weight: 800; background: #edf2f7; padding: 3px 5px; border-radius: 4px; color: #2b6cb0; }
        .active-user-cards { width: 100%; display: flex; flex-direction: column; gap: 8px; }
        .user-card-box { background: #ffffff; border-radius: 6px; padding: 6px; border: 1px solid #cbd5e0; }
        .user-card-title { font-size: 9px; font-weight: 700; color: #3182ce; margin-bottom: 4px; text-align: center; }
        .user-matrix-header { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; margin-bottom: 2px; text-align: center; font-weight: 900; font-size: 8px; color: #ffffff; }
        .umh-b { background: #2196f3; } .umh-i { background: #f44336; } .umh-n { background: #ff9800; } .umh-g { background: #4caf50; } .umh-o { background: #9c27b0; }
        .user-matrix { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
        .um-cell { background: #f7fafc; border: 1px solid #cbd5e0; font-size: 9px; font-weight: 700; text-align: center; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #1a202c; }
        .um-cell.marked { background: #48bb78 !important; color: #ffffff !important; }
        .um-cell.free-cell { background: #ecc94b !important; color: #744210 !important; }
        .bingo-btn { width: 100%; margin-top: 5px; background: #3182ce; color: white; border: none; padding: 4px; font-size: 10px; font-weight: bold; border-radius: 3px; cursor: pointer; }
        #custom-toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(30, 35, 45, 0.95); color: #ffffff; padding: 12px 20px; border-radius: 10px; font-size: 13px; font-weight: 600; z-index: 1000; transition: transform 0.3s ease, opacity 0.3s ease; opacity: 0; text-align: center; }
        #custom-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>
    <div class="container">
        <!-- PAGE 1 -->
        <div id="page-buy" class="page active">
            <div class="header">
                <div style="display: flex; align-items: center; gap: 16px;">
                    <button class="close-btn">&#10005;</button>
                    <div class="title">YejuBingo</div>
                </div>
            </div>
            <div class="stats-bar">
                <div class="stat-badge badge-room"><span class="stat-label" style="color: #6b4f00;">ROOM</span><span class="stat-value">VIP 💰</span></div>
                <div class="stat-badge badge-sold"><span class="stat-label">SOLD</span><span class="stat-value" id="sold-count">0</span></div>
                <div class="stat-badge badge-time"><span class="stat-label">TIME</span><span class="stat-value" id="timer">40s</span></div>
                <div class="stat-badge badge-balance"><span class="stat-label" style="color: #e2fccf;">BALANCE</span><span class="stat-value" id="balance-amount">950.00 ETB</span></div>
            </div>
            <div class="grid-wrapper">
                <div class="grid-container">
                    <div class="numbers-grid" id="numbersGrid"></div>
                </div>
            </div>
            <div class="slots-section">
                <div class="slots-row">
                    <div class="slot-box" id="slot1" onclick="clearSlot(1)">
                        <div class="slot-icon" id="slot1-icon">+</div>
                        <div class="slot-text" id="slot1-text">SLOT 1 EMPTY</div>
                    </div>
                    <div class="slot-box" id="slot2" onclick="clearSlot(2)">
                        <div class="slot-icon" id="slot2-icon">+</div>
                        <div class="slot-text" id="slot2-text">SLOT 2 EMPTY</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PAGE 2 -->
        <div id="page-game" class="page">
            <div class="header">
                <div style="display: flex; align-items: center; gap: 16px;">
                    <button class="close-btn">&#10005;</button>
                    <div class="title">YejuBingo</div>
                </div>
            </div>
            <div class="game-header-stats">
                <div>ደራሽ <span id="derash-val">0 ETB</span></div>
                <div>BALLS <span id="balls-val">0/75</span></div>
                <div>PLAYERS <span id="players-val">0</span></div>
            </div>
            <div class="game-body">
                <div class="balls-table-container">
                    <div class="bingo-header-row"><div class="bh-b">B</div><div class="bh-i">I</div><div class="bh-n">N</div><div class="bh-g">G</div><div class="bh-o">O</div></div>
                    <div class="balls-grid-1-75" id="ballsGrid1To75"></div>
                </div>
                <div class="game-main-area">
                    <div class="recent-balls-bar">
                        <span style="font-size: 8px; font-weight: 700; color: #718096;">RECENT:</span>
                        <div id="recentTagsContainer" style="display: flex; gap: 3px;"></div>
                    </div>
                    <div class="active-user-cards" id="activeUserCardsContainer"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="custom-toast"></div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const webAppUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
        let userTelegramId = webAppUser?.id ? String(webAppUser.id) : "test_user_123";

        const SERVER_URL = 'https://index-html-2-8yfn.onrender.com';

        let cardPrice = 10.00;
        let soldCount = parseInt(localStorage.getItem('y_soldCount')) || 0;
        let balance = 950.00; 
        let selectedCards = JSON.parse(localStorage.getItem(`y_selectedCards_${userTelegramId}`)) || [];
        let gameStarted = localStorage.getItem('y_gameStarted') === 'true';
        let cardMatrices = JSON.parse(localStorage.getItem('y_cardMatrices')) || {};
        let calledBalls = JSON.parse(localStorage.getItem('y_calledBalls')) || [];
        let markedCellsState = JSON.parse(localStorage.getItem('y_markedCellsState')) || {};

        let roundStartTime = parseInt(localStorage.getItem('y_roundStartTime'));
        if (!roundStartTime || isNaN(roundStartTime)) {
            roundStartTime = Date.now();
            localStorage.setItem('y_roundStartTime', roundStartTime);
        }

        function generateColumnNumber(colIndex) {
            let min = colIndex * 15 + 1;
            let max = min + 14;
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        if (Object.keys(cardMatrices).length === 0) {
            for (let i = 1; i <= 250; i++) {
                let matrix = [];
                let colUsed = Array.from({length: 5}, () => new Set());
                for (let r = 0; r < 5; r++) {
                    let row = [];
                    for (let c = 0; c < 5; c++) {
                        if (r === 2 && c === 2) {
                            row.push('★');
                        } else {
                            let randNum;
                            do {
                                randNum = generateColumnNumber(c);
                            } while (colUsed[c].has(randNum));
                            colUsed[c].add(randNum);
                            row.push(randNum);
                        }
                    }
                    matrix.push(row);
                }
                cardMatrices[i] = matrix;
            }
            localStorage.setItem('y_cardMatrices', JSON.stringify(cardMatrices));
        }

        const gridEl = document.getElementById('numbersGrid');
        for (let i = 1; i <= 250; i++) {
            const cell = document.createElement('div');
            cell.className = 'number-cell';
            cell.innerText = i;
            cell.dataset.number = i;
            if (selectedCards.includes(i)) cell.classList.add('selected');
            cell.addEventListener('click', () => toggleSelect(i, cell));
            gridEl.appendChild(cell);
        }

        updateDisplay();

        const mainInterval = setInterval(() => {
            const elapsed = Math.floor((Date.now() - roundStartTime) / 1000);
            let timeLeft = 40 - elapsed;

            if (!gameStarted) {
                const timerEl = document.getElementById('timer');
                if (timerEl) timerEl.innerText = Math.max(0, timeLeft) + 's';

                if (timeLeft <= 0) {
                    gameStarted = true;
                    localStorage.setItem('y_gameStarted', 'true');
                    switchToGamePage();
                }
            }
        }, 1000);

        function toggleSelect(num, cell) {
            if (gameStarted) return;
            const index = selectedCards.indexOf(num);
            
            if (index > -1) {
                selectedCards.splice(index, 1);
                cell.classList.remove('selected');
                soldCount = Math.max(0, soldCount - 1);
                balance += cardPrice;
            } else {
                if (balance < cardPrice) {
                    showNotification('ባላንስዎ በቂ አይደለም!');
                    return;
                }
                if (selectedCards.length >= 2) {
                    showNotification('ከሁለት በላይ ካርድ መምረጥ አይችሉም!');
                    return;
                }
                selectedCards.push(num);
                cell.classList.add('selected');
                soldCount++;
                balance -= cardPrice;
            }
            saveState();
            updateDisplay();
        }

        function clearSlot(slotNum) {
            if (gameStarted) return;
            let removed = null;
            if (slotNum === 1 && selectedCards.length > 0) {
                removed = selectedCards.shift();
            } else if (slotNum === 2 && selectedCards.length > 1) {
                removed = selectedCards.pop();
            }
            if (removed !== null) {
                const cell = document.querySelector(`[data-number='${removed}']`);
                if (cell) cell.classList.remove('selected');
                soldCount = Math.max(0, soldCount - 1);
                balance += cardPrice;
                saveState();
                updateDisplay();
            }
        }

        function updateDisplay() {
            document.getElementById('sold-count').innerText = soldCount;
            document.getElementById('balance-amount').innerText = balance.toFixed(2) + ' ETB';
            renderSlot(1, selectedCards[0]);
            renderSlot(2, selectedCards[1]);
        }

        function renderSlot(slotNum, cardNum) {
            const box = document.getElementById(`slot${slotNum}`);
            if (!box) return;
            if (cardNum !== undefined) {
                box.classList.add('filled');
                let html = `<div class="slot-text">SLOT ${slotNum} (CARD #${cardNum})</div><div class="mini-matrix-wrapper"><div class="mini-matrix-header"><div class="mmh-b">B</div><div class="mmh-i">I</div><div class="mmh-n">N</div><div class="mmh-g">G</div><div class="mmh-o">O</div></div><div class="mini-matrix">`;
                const matrix = cardMatrices[cardNum];
                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 5; c++) {
                        let val = matrix[r][c];
                        html += `<div class="matrix-cell ${val === '★' ? 'free-cell' : ''}">${val}</div>`;
                    }
                }
                html += `</div></div>`;
                box.innerHTML = html;
            } else {
                box.classList.remove('filled');
                box.innerHTML = `<div class="slot-icon">+</div><div class="slot-text">SLOT ${slotNum} EMPTY</div>`;
            }
        }

        function switchToGamePage() {
            document.getElementById('page-buy').classList.remove('active');
            document.getElementById('page-game').classList.add('active');
            document.getElementById('derash-val').innerText = (soldCount * 8) + ' ETB';
            document.getElementById('players-val').innerText = soldCount;

            const bGrid = document.getElementById('ballsGrid1To75');
            bGrid.innerHTML = '';
            for (let r = 1; r <= 15; r++) {
                for (let c = 0; c < 5; c++) {
                    let num = c * 15 + r;
                    const bCell = document.createElement('div');
                    bCell.className = 'b-cell';
                    bCell.innerText = num;
                    bCell.id = `ball-num-${num}`;
                    bGrid.appendChild(bCell);
                }
            }

            setInterval(() => {
                if (calledBalls.length < 75) {
                    let available = [];
                    for(let i=1; i<=75; i++) if(!calledBalls.includes(i)) available.push(i);
                    if(available.length > 0) {
                        let drawn = available[Math.floor(Math.random() * available.length)];
                        calledBalls.push(drawn);
                        const target = document.getElementById(`ball-num-${drawn}`);
                        if(target) target.classList.add('called');
                        saveState();
                    }
                }
            }, 3000);
        }

        function saveState() {
            localStorage.setItem('y_soldCount', soldCount);
            localStorage.setItem(`y_selectedCards_${userTelegramId}`, JSON.stringify(selectedCards));
            localStorage.setItem('y_markedCellsState', JSON.stringify(markedCellsState));
            localStorage.setItem('y_calledBalls', JSON.stringify(calledBalls));
        }

        function showNotification(msg) {
            const toast = document.getElementById('custom-toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
    </script>
</body>
</html>
