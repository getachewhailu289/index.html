<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YejuBingo Telegram Mini App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #171b22;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 0;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #171b22;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header Bar */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: #171b22;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
        }

        .title {
            font-size: 19px;
            font-weight: 600;
            color: #ffffff;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .dropdown-arrow {
            background: none;
            border: none;
            color: #a0aec0;
            font-size: 16px;
            cursor: pointer;
        }

        .menu-dots {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
        }

        /* Top Badges Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr 0.9fr 1.3fr;
            gap: 6px;
            padding: 8px 12px 14px 12px;
            background: #171b22;
        }

        .stat-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 4px;
            border-radius: 10px;
            font-size: 11px;
            height: 44px;
        }

        .badge-room {
            background: #fbc02d;
            color: #1a1e29;
            font-weight: 800;
            font-size: 12px;
        }

        .badge-sold {
            background: #262d3d;
            color: #ffffff;
            border: 1px solid #323b4e;
        }

        .badge-time {
            background: #262d3d;
            color: #ff5252;
            border: 1px solid #323b4e;
        }

        .badge-balance {
            background: #00c853;
            color: #ffffff;
            font-weight: 700;
        }

        .stat-label {
            font-size: 9px;
            text-transform: uppercase;
            font-weight: 700;
            opacity: 0.9;
            margin-bottom: 1px;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 12px;
            font-weight: 700;
        }

        /* Grid Section Container */
        .grid-wrapper {
            background: #e4e7ed;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 12px 8px;
            flex: 1;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.1);
        }

        .grid-container {
            max-height: 300px;
            overflow-y: auto;
            padding: 4px;
        }

        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 6px;
        }

        .number-cell {
            background: #ffffff;
            color: #2d3748;
            border-radius: 6px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
            transition: all 0.1s ease;
        }

        .number-cell.selected {
            background: #d0d5dd;
            color: #667085;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.15);
            transform: scale(0.96);
        }

        /* Slots Section at the bottom */
        .slots-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 12px 16px;
            background: #ffffff;
            color: #2d3748;
            border-top: 1px solid #dcdfe6;
        }

        .slots-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .slot-box {
            border: 2px dashed #cbd5e0;
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 110px;
            background: #f7fafc;
            cursor: pointer;
            position: relative;
        }

        .slot-box.filled {
            border-style: solid;
            border-color: #3182ce;
            background: #ebf8ff;
        }

        .slot-icon {
            font-size: 20px;
            color: #a0aec0;
            margin-bottom: 2px;
        }

        .slot-text {
            font-size: 9px;
            font-weight: 700;
            color: #718096;
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        /* Mini 5x5 Matrix inside slot */
        .mini-matrix {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
            width: 100%;
            max-width: 120px;
        }

        .matrix-cell {
            background: #ffffff;
            color: #1a202c;
            font-size: 8px;
            font-weight: 700;
            text-align: center;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
            border: 1px solid #cbd5e0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <button class="close-btn">&#10005;</button>
                <div class="title">YejuBingo</div>
            </div>
            <div class="header-right">
                <button class="dropdown-arrow">&#9660;</button>
                <button class="menu-dots">&#8942;</button>
            </div>
        </div>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-badge badge-room">
                <span class="stat-label" style="color: #6b4f00;">ROOM</span>
                <span class="stat-value">VIP 💰</span>
            </div>
            <div class="stat-badge badge-sold" id="sold-badge">
                <span class="stat-label" style="color: #94a3b8;">SOLD</span>
                <span class="stat-value" id="sold-count">0</span>
            </div>
            <div class="stat-badge badge-time">
                <span class="stat-label" style="color: #94a3b8;">TIME</span>
                <span class="stat-value" id="timer">29s</span>
            </div>
            <div class="stat-badge badge-balance">
                <span class="stat-label" style="color: #e2fccf;">BALANCE</span>
                <span class="stat-value" id="balance-amount">50.00 ETB</span>
            </div>
        </div>

        <!-- Numbers Grid (1 to 250) -->
        <div class="grid-wrapper">
            <div class="grid-container">
                <div class="numbers-grid" id="numbersGrid">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>

        <!-- Slots Section -->
        <div class="slots-section">
            <div class="slots-row">
                <div class="slot-box" id="slot1" onclick="clearSlot(1)">
                    <div class="slot-icon" id="slot1-icon">+</div>
                    <div class="slot-text" id="slot1-text">SLOT 1 EMPTY</div>
                </div>
                <div class="slot-box" id="slot2" onclick="clearSlot(2)">
                    <div class="slot-icon" id="slot2-icon">+</div>
                    <div class="slot-text" id="slot2-text">SLOT 2 EMPTY</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const cardPrice = 10.00;
        
        // Load Saved State from localStorage or set defaults
        let soldCount = localStorage.getItem('yeju_soldCount') ? parseInt(localStorage.getItem('yeju_soldCount')) : 0;
        let timeLeft = localStorage.getItem('yeju_timeLeft') ? parseInt(localStorage.getItem('yeju_timeLeft')) : 29;
        let balance = localStorage.getItem('yeju_balance') ? parseFloat(localStorage.getItem('yeju_balance')) : 50.00;
        let selectedCards = localStorage.getItem('yeju_selectedCards') ? JSON.parse(localStorage.getItem('yeju_selectedCards')) : [];

        // Generate or Load Secret Matrices for 250 cards
        let cardMatrices = localStorage.getItem('yeju_cardMatrices') ? JSON.parse(localStorage.getItem('yeju_cardMatrices')) : {};
        if (Object.keys(cardMatrices).length === 0) {
            for (let i = 1; i <= 250; i++) {
                let matrix = [];
                let usedNums = new Set();
                for (let r = 0; r < 5; r++) {
                    let row = [];
                    for (let c = 0; c < 5; c++) {
                        let randNum;
                        do {
                            randNum = Math.floor(Math.random() * 75) + 1;
                        } while (usedNums.has(randNum));
                        usedNums.add(randNum);
                        row.push(randNum);
                    }
                    matrix.push(row);
                }
                cardMatrices[i] = matrix;
            }
            localStorage.setItem('yeju_cardMatrices', JSON.stringify(cardMatrices));
        }

        const gridEl = document.getElementById('numbersGrid');
        for (let i = 1; i <= 250; i++) {
            const cell = document.createElement('div');
            cell.className = 'number-cell';
            cell.innerText = i;
            cell.dataset.number = i;

            // Mark selected if already in saved state
            if (selectedCards.includes(i)) {
                cell.classList.add('selected');
            }

            cell.addEventListener('click', () => toggleSelect(i, cell));
            gridEl.appendChild(cell);
        }

        // Initial Display Update
        updateDisplay();

        // Timer countdown with persistence
        setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
            } else {
                timeLeft = 29; // Restart timer if it reaches 0
            }
            localStorage.setItem('yeju_timeLeft', timeLeft);
            document.getElementById('timer').innerText = timeLeft + 's';
        }, 1000);

        function saveState() {
            localStorage.setItem('yeju_soldCount', soldCount);
            localStorage.setItem('yeju_timeLeft', timeLeft);
            localStorage.setItem('yeju_balance', balance);
            localStorage.setItem('yeju_selectedCards', JSON.stringify(selectedCards));
        }

        function toggleSelect(num, cell) {
            const index = selectedCards.indexOf(num);
            if (index > -1) {
                selectedCards.splice(index, 1);
                cell.classList.remove('selected');
                balance += cardPrice;
                soldCount--;
            } else {
                if (balance <= 0) {
                    alert('ባላንስዎ ስለተጠናቀቀ ወይም ዜሮ ስለሆነ ተጨማሪ ካርድ መምረጥ አይችሉም!');
                    return;
                }
                if (selectedCards.length >= 2) {
                    alert('ከሁለት በላይ ካርድ መምረጥ አይችሉም!');
                    return;
                }
                selectedCards.push(num);
                cell.classList.add('selected');
                balance -= cardPrice;
                soldCount++;
            }
            saveState();
            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById('sold-count').innerText = soldCount;
            document.getElementById('balance-amount').innerText = balance.toFixed(2) + ' ETB';
            document.getElementById('timer').innerText = timeLeft + 's';

            // Slot 1
            renderSlot(1, selectedCards[0]);
            // Slot 2
            renderSlot(2, selectedCards[1]);
        }

        function renderSlot(slotNum, cardNum) {
            const box = document.getElementById(`slot${slotNum}`);
            if (cardNum !== undefined) {
                box.classList.add('filled');
                let matrixHtml = `<div class="slot-text">SLOT ${slotNum} (CARD #${cardNum})</div><div class="mini-matrix">`;
                const matrix = cardMatrices[cardNum];
                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 5; c++) {
                        matrixHtml += `<div class="matrix-cell">${matrix[r][c]}</div>`;
                    }
                }
                matrixHtml += `</div>`;
                box.innerHTML = matrixHtml;
            } else {
                box.classList.remove('filled');
                box.innerHTML = `<div class="slot-icon" id="slot${slotNum}-icon">+</div>
                                 <div class="slot-text" id="slot${slotNum}-text">SLOT ${slotNum} EMPTY</div>`;
            }
        }

        function clearSlot(slotNum) {
            if (slotNum === 1 && selectedCards.length > 0) {
                const removed = selectedCards.shift();
                const cell = document.querySelector(`[data-number='${removed}']`);
                if(cell) cell.classList.remove('selected');
                balance += cardPrice;
                soldCount--;
            } else if (slotNum === 2 && selectedCards.length > 1) {
                const removed = selectedCards.pop();
                const cell = document.querySelector(`[data-number='${removed}']`);
                if(cell) cell.classList.remove('selected');
                balance += cardPrice;
                soldCount--;
            }
            saveState();
            updateDisplay();
        }
    </script>
</body>
</html>
