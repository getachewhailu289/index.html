<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YejuBingo Mini App</title>
    
    <!-- Firebase App (Modular SDKs) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCmpdrWGSTAJUk_muPnBQliZJah7gHOXY",
            authDomain: "yejubingo-f57a7.firebaseapp.com",
            databaseURL: "https://yejubingo-f57a7-default-rtdb.firebaseio.com",
            projectId: "yejubingo-f57a7",
            storageBucket: "yejubingo-f57a7.appspot.com",
            messagingSenderId: "871531976284",
            appId: "1:871531976284:web:8791a06c362c2c8c573899",
            measurementId: "G-RZ86XL3CDH"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Global Game Variables synced with Firebase
        window.db = db;
        window.rtdbRef = ref;
        window.rtdbSet = set;
        window.rtdbOnValue = onValue;
        window.rtdbUpdate = update;
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ffcc00;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .ball-display {
            font-size: 60px;
            font-weight: bold;
            color: #00ffcc;
            margin: 20px 0;
            background: #2b2b2b;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            line-height: 120px;
            display: inline-block;
            box-shadow: inset 0 0 15px rgba(0,255,204,0.3);
        }
        .timer {
            font-size: 18px;
            color: #ff4444;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>YejuBingo Live</h1>
        <div class="timer" id="timerDisplay">ቀጣይ ኳስ በ: -- ሰከንድ</div>
        <div class="ball-display" id="currentBall">-</div>
        <p id="statusText">ጨዋታው በመካሄድ ላይ ነው...</p>
    </div>

    <script>
        // ትንሽ ቆይቶ ፋየርቤዝ እስኪጭን በመጠበቅ ሎጂኩን ማስተካከል
        setTimeout(() => {
            if (!window.db) return;

            const db = window.db;
            const gameRef = window.rtdbRef(db, 'activeGame');

            // ከዚህ በታች የጨዋታውን ማመሳሰያ ኮዶች ማስተካከል እንችላለን
            window.rtdbOnValue(gameRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    document.getElementById('currentBall').innerText = data.currentBall || '-';
                }
            });
        }, 1000);
    </script>

</body>
</html>
