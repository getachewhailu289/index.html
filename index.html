<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeju Bingo - ካርቴላ መምረጫ</title>
    <!-- የቴሌግራም ዌብ አፕ ስክሪፕት -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #fff; text-align: center; padding: 20px; }
        .balance-box { background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-size: 18px; }
        .balance-amount { color: #4ade80; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>የጁ ቢንጎ (Yeju Bingo)</h1>
        
        <!-- ባላንስ የሚታይበት ቦታ -->
        <div class="balance-box">
            የእርስዎ ባላንስ: <span id="balance-display" class="balance-amount">ጫን በመጫን ላይ...</span>
        </div>

        <div class="card-selector">
            <!-- የካርቴላ መምረጫ ቦታዎችዎ እዚህ ይኖራሉ -->
            <p>ካርቴላ መምረጫ ቦታ</p>
        </div>
    </div>

    <script>
        // አፑ ሲከፈት ከሰርቨር ባላንሱን ማምጣት
        async function fetchUserBalance() {
            try {
                // ከቴሌግራም ዌብ አፕ የዩዘር መለያን (ID) በራስ ሰር መውሰድ
                const tg = window.Telegram.WebApp;
                tg.expand(); // አፑን ሙሉ ስክሪን ማድረግ
                
                const userId = tg.initDataUnsafe?.user?.id;

                if (!userId) {
                    document.getElementById('balance-display').innerText = "0 ብር (ዩዘር አልተገኘም)";
                    return;
                }

                // ሰርቨርዎ ባለበት አድራሻ (ለምሳሌ ሎካልሆስት ወይም የሰርቨር  लिंक) ባላንሱን መጠየቅ
                const response = await fetch(`/api/balance?telegram_id=${userId}`);
                const data = await response.json();

                if (response.ok) {
                    // ከሰርቨር የመጣውን ትክክለኛ ባላንስ ማሳየት (ለምሳሌ 450 ብር)
                    document.getElementById('balance-display').innerText = `${data.balance} ብር`;
                } else {
                    document.getElementById('balance-display').innerText = "0 ብር";
                }
            } catch (error) {
                console.error("ባላንስ ማምጣት አልተቻለም:", error);
                document.getElementById('balance-display').innerText = "0 ብር";
            }
        }

        // ገጹ ሲከፈት ተግባሩን ማስኬድ
        window.onload = () => {
            fetchUserBalance();
        };
    </script>
</body>
</html>
