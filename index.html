<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeju Bingo Mini App</title>
    <style>
        /* እዚህ ጋር የስታይል (CSS) ማስተካከያዎች ይኖራሉ */
        body {
            font-family: Arial, sans-serif;
            background-color: #f7fafc;
            margin: 0;
            padding: 0;
            color: #2d3748;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 15px;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #2d3748;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }
        .toast.show {
            opacity: 1;
        }
        .slot-box {
            border: 2px dashed #cbd5e0;
            padding: 15px;
            text-align: center;
            margin-bottom: 10px;
            border-radius: 8px;
            background: #fff;
        }
        .slot-box.filled {
            border: 2px solid #3182ce;
        }
        .number-cell {
            display: inline-block;
            width: 30px;
            height: 30px;
            margin: 2px;
            text-align: center;
            line-height: 30px;
            background: #edf2f7;
            cursor: pointer;
            border-radius: 4px;
        }
        .number-cell.selected {
            background: #3182ce;
            color: white;
        }
        .mini-matrix, .user-matrix {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
            margin-top: 5px;
        }
        .matrix-cell, .um-cell {
            background: #edf2f7;
            text-align: center;
            font-size: 10px;
            padding: 4px 0;
            border-radius: 2px;
        }
        .free-cell, .marked {
            background: #48bb78 !important;
            color: white;
        }
        .b-cell {
            display: inline-block;
            width: 28px;
            height: 28px;
            margin: 2px;
            text-align: center;
            line-height: 28px;
            background: #edf2f7;
            font-size: 11px;
            border-radius: 50%;
        }
        .b-cell.called {
            background: #e53e3e;
            color: white;
        }
        .bingo-btn {
            background: #3182ce;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ገጽ 1: መግዣ እና ስሎቶች -->
        <div id="page-buy" class="page active">
            <h2>የጁ ቢንጎ - የካርድ መምረጫ</h2>
            <p>ሂሳብ: <span id="balance-amount">100.00 ETB</span></p>
            <p>የተሸጡ ካርዶች: <span id="sold-count">0</span></p>

            <div id="slot1" class="slot-box" onclick="clearSlot(1)">
                <div class="slot-icon">+</div>
                <div class="slot-text">SLOT 1 EMPTY</div>
            </div>
            <div id="slot2" class="slot-box" onclick="clearSlot(2)">
                <div class="slot-icon">+</div>
                <div class="slot-text">SLOT 2 EMPTY</div>
            </div>

            <h3>ካርዶች ይምረጡ (1 እስከ 75)</h3>
            <div id="cardsGrid">
                <!-- በጃቫስክሪፕት የሚሞላ ፍርግርግ -->
            </div>

            <button class="bingo-btn" onclick="switchToGamePage()">ወደ ጨዋታው ግባ</button>
        </div>

        <!-- ገጽ 2: የጨዋታው ገጽ -->
        <div id="page-game" class="page">
            <h2>የቢንጎ ጨዋታ በሂደት ላይ...</h2>
            <p>ደርስ: <span id="derash-val">0.00 ETB</span> | ቦሎች: <span id="balls-val">0/75</span> | ተጫዋቾች: <span id="players-val">12</span></p>

            <div id="recentTagsContainer" style="display: flex; gap: 5px; margin-bottom: 10px;"></div>

            <h3>የተጠሩ ቦሎች ሰንጠረዥ</h3>
            <div id="ballsGrid1To75" style="max-height: 150px; overflow-y: auto; background: #fff; padding: 5px; border: 1px solid #cbd5e0;"></div>

            <h3>የእርስዎ ንቁ ካርዶች</h3>
            <div id="activeUserCardsContainer"></div>
        </div>
    </div>

    <!-- ማሳሰቢያ (Toast) -->
    <div id="custom-toast" class="toast"></div>

    <script>
        // የውሂብ ተለዋዋጮች (Variables initialization)
        let balance = parseFloat(localStorage.getItem('y_balance')) || 100.00;
        let soldCount = parseInt(localStorage.getItem('y_soldCount')) || 0;
        let selectedCards = JSON.parse(localStorage.getItem('y_selectedCards')) || [];
        let calledBalls = JSON.parse(localStorage.getItem('y_calledBalls')) || [5, 12, 33, 45, 60];
        let markedCellsState = JSON.parse(localStorage.getItem('y_markedCellsState')) || {};
        let gameStarted = localStorage.getItem('y_gameStarted') === 'true';
        let cardPrice = 10;
        let mainInterval = null;

        // የካርድ ማትሪክስ ናሙና (Card Matrices Generator / Dummy Data)
        let cardMatrices = JSON.parse(localStorage.getItem('y_cardMatrices')) || generateDummyMatrices();

        function generateDummyMatrices() {
            let matrices = {};
            for (let i = 1; i <= 75; i++) {
                matrices[i] = [
                    [i, i+1, i+2, i+3, i+4],
                    [i+5, i+6, i+7, i+8, i+9],
                    [i+10, i+11, '★', i+13, i+14],
                    [i+15, i+16, i+17, i+18, i+19],
                    [i+20, i+21, i+22, i+23, i+24]
                ];
            }
            localStorage.setItem('y_cardMatrices', JSON.stringify(matrices));
            return matrices;
        }

        // ገጽ ሲከፈት የሚደረግ ዝግጅት
        window.onload = function() {
            buildCardsGrid();
            updateDisplay();
            if (gameStarted) {
                switchToGamePage();
            }
        };

        function buildCardsGrid() {
            const grid = document.getElementById('cardsGrid');
            if (!grid) return;
            grid.innerHTML = '';
            for (let i = 1; i <= 75; i++) {
                const cell = document.createElement('div');
                cell.className = 'number-cell';
                cell.dataset.number = i;
                cell.innerText = i;
                if (selectedCards.includes(i)) {
                    cell.classList.add('selected');
                }
                cell.addEventListener('click', () => toggleSelect(i, cell));
                grid.appendChild(cell);
            }
        }

        function showNotification(message) {
            const toast = document.getElementById('custom-toast');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function clearSlot(slotIndex) {
            if (selectedCards.length === 0) return;
            let removedCard = selectedCards.shift();
            localStorage.setItem('y_selectedCards', JSON.stringify(selectedCards));
            
            const cell = document.querySelector(`.number-cell[data-number="${removedCard}"]`);
            if (cell) cell.classList.remove('selected');

            soldCount = Math.max(0, soldCount - 1);
            localStorage.setItem('y_soldCount', soldCount);

            updateDisplay();
            showNotification(`ካርድ #${removedCard} ከስሎቱ ተወግዷል!`);
        }

        function toggleSelect(number, cellElement) {
            if (gameStarted) {
                showNotification('ጨዋታው ስለጀመረ ካርድ መምረጥ አይቻልም!');
                return;
            }

            const index = selectedCards.indexOf(number);
            if (index > -1) {
                selectedCards.splice(index, 1);
                cellElement.classList.remove('selected');
                soldCount = Math.max(0, soldCount - 1);
            } else {
                if (selectedCards.length >= 2) {
                    showNotification('ቢበዛ 2 ካርዶች ብቻ መምረጥ ይቻላል!');
                    return;
                }
                if (balance < cardPrice) {
                    showNotification('ሂሳብዎ በቂ አይደለም!');
                    return;
                }
                selectedCards.push(number);
                cellElement.classList.add('selected');
                soldCount += 1;
            }

            localStorage.setItem('y_selectedCards', JSON.stringify(selectedCards));
            localStorage.setItem('y_soldCount', soldCount);
            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById('sold-count').innerText = soldCount;
            document.getElementById('balance-amount').innerText = balance.toFixed(2) + ' ETB';
            localStorage.setItem('y_balance', balance);

            for (let i = 1; i <= 2; i++) {
                const slotBox = document.getElementById(`slot${i}`);
                const cardNum = selectedCards[i - 1];

                if (cardNum) {
                    slotBox.classList.add('filled');
                    slotBox.innerHTML = `
                        <div style="font-size: 9px; font-weight: 800; color: #2b6cb0; margin-bottom: 2px;">CARD #${cardNum}</div>
                        <div class="mini-matrix-wrapper">
                            <div class="mini-matrix" id="mini-matrix-${cardNum}"></div>
                        </div>
                    `;
                    renderMiniMatrix(cardNum, `mini-matrix-${cardNum}`);
                } else {
                    slotBox.classList.remove('filled');
                    slotBox.innerHTML = `
                        <div class="slot-icon">+</div>
                        <div class="slot-text">SLOT ${i} EMPTY</div>
                    `;
                }
            }
        }

        function renderMiniMatrix(cardNum, containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';
            const matrix = cardMatrices[cardNum];
            if (!matrix) return;

            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'matrix-cell';
                    let val = matrix[r][c];
                    cell.innerText = val;
                    if (val === '★') {
                        cell.classList.add('free-cell');
                    }
                    container.appendChild(cell);
                }
            }
        }

        function switchToGamePage() {
            document.getElementById('page-buy').classList.remove('active');
            document.getElementById('page-game').classList.add('active');
            gameStarted = true;
            localStorage.setItem('y_gameStarted', 'true');

            buildBallsGrid1To75();
            buildActiveUserCards();
            updateRecentTags();

            document.getElementById('derash-val').innerText = (soldCount * 8).toFixed(2) + ' ETB';
            document.getElementById('balls-val').innerText = calledBalls.length + '/75';
            document.getElementById('players-val').innerText = Math.max(12, soldCount * 15);
        }

        function buildBallsGrid1To75() {
            const grid = document.getElementById('ballsGrid1To75');
            if (!grid) return;
            grid.innerHTML = '';
            for (let i = 1; i <= 75; i++) {
                const cell = document.createElement('div');
                cell.className = 'b-cell';
                cell.id = `ball-num-${i}`;
                cell.innerText = i;
                if (calledBalls.includes(i)) {
                    cell.classList.add('called');
                }
                grid.appendChild(cell);
            }
        }

        function buildActiveUserCards() {
            const container = document.getElementById('activeUserCardsContainer');
            if (!container) return;
            container.innerHTML = '';

            if (selectedCards.length === 0) {
                container.innerHTML = `<div style="font-size: 10px; color: #718096; text-align: center; padding: 10px;">ምንም ካርድ አልመረጡም</div>`;
                return;
            }

            selectedCards.forEach(cardNum => {
                const box = document.createElement('div');
                box.className = 'slot-box';
                box.id = `matrix-box-${cardNum}`;

                let html = `
                    <div style="font-weight: bold; margin-bottom: 5px;">CARD #${cardNum}</div>
                    <div class="user-matrix" id="um-${cardNum}"></div>
                    <button class="bingo-btn" onclick="manualCheckBingo(${cardNum})">ቢንጎ (BINGO!)</button>
                `;
                box.innerHTML = html;
                container.appendChild(box);

                renderUserMatrix(cardNum, `um-${cardNum}`);
            });
        }

        function renderUserMatrix(cardNum, containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';
            const matrix = cardMatrices[cardNum];
            if (!matrix) return;

            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'um-cell';
                    let val = matrix[r][c];
                    cell.innerText = val;
                    cell.dataset.val = val;
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    if (val === '★') {
                        cell.classList.add('free-cell', 'marked');
                    } else {
                        if (calledBalls.includes(parseInt(val))) {
                            cell.classList.add('marked');
                        }
                        if (markedCellsState[`${cardNum}_${r}_${c}`]) {
                            cell.classList.add('marked');
                        }
                    }

                    cell.addEventListener('click', () => {
                        if (val !== '★' && calledBalls.includes(parseInt(val))) {
                            cell.classList.toggle('marked');
                            markedCellsState[`${cardNum}_${r}_${c}`] = cell.classList.contains('marked');
                            saveState();
                        }
                    });

                    container.appendChild(cell);
                }
            }
        }

        function updateRecentTags() {
            const container = document.getElementById('recentTagsContainer');
            if (!container) return;
            container.innerHTML = '';
            let recent = calledBalls.slice(-5).reverse();
            recent.forEach(ball => {
                const tag = document.createElement('div');
                tag.style.background = '#3182ce';
                tag.style.color = '#fff';
                tag.style.padding = '2px 6px';
                tag.style.borderRadius = '4px';
                tag.style.fontSize = '12px';
                tag.innerText = getBallLetter(ball) + '-' + ball;
                container.appendChild(tag);
            });
        }

        function getBallLetter(num) {
            if (num <= 15) return 'B';
            if (num <= 30) return 'I';
            if (num <= 45) return 'N';
            if (num <= 60) return 'G';
            return 'O';
        }

        function checkWinningCondition(cardNum) {
            const matrix = cardMatrices[cardNum];
            const box = document.getElementById(`matrix-box-${cardNum}`);
            if (!matrix || !box) return false;

            let cells = Array.from(box.querySelectorAll('.um-cell'));
            let grid = Array.from({length: 5}, () => Array(5).fill(false));

            cells.forEach(cell => {
                let r = parseInt(cell.dataset.row);
                let c = parseInt(cell.dataset.col);
                if (cell.classList.contains('marked')) {
                    grid[r][c] = true;
                }
            });

            // ረድፎችን (Rows) ማረጋገጥ
            for (let r = 0; r < 5; r++) {
                if (grid[r].every(val => val)) return true;
            }

            // አምዶችን (Columns) ማረጋገጥ
            for (let c = 0; c < 5; c++) {
                let colWin = true;
                for (let r = 0; r < 5; r++) {
                    if (!grid[r][c]) colWin = false;
                }
                if (colWin) return true;
            }

            // ሰያፍ (Diagonals) ማረጋገጥ
            let diag1 = true, diag2 = true;
            for (let i = 0; i < 5; i++) {
                if (!grid[i][i]) diag1 = false;
                if (!grid[i][4 - i]) diag2 = false;
            }
            if (diag1 || diag2) return true;

            return false;
        }

        function manualCheckBingo(cardNum) {
            if (checkWinningCondition(cardNum)) {
                let prize = soldCount * 8;
                balance += prize;
                showNotification(`🎉 ትክክለኛ ቢንጎ! ካርድ #${cardNum} አሸንፏል! 🏆 +${prize} ETB ተጨምሯል።`);
                saveState();
                if (mainInterval) clearInterval(mainInterval);
                setTimeout(() => resetGameLoopLocally(), 2500);
            } else {
                showNotification(`❌ ገና አልሞላም! ተጨማሪ ቦሎችን ይጠብቁ።`);
            }
        }

        function resetGameLoopLocally() {
            localStorage.removeItem('y_gameStarted');
            localStorage.removeItem('y_calledBalls');
            localStorage.removeItem('y_markedCellsState');
            localStorage.removeItem('y_selectedCards');
            localStorage.removeItem('y_soldCount');
            localStorage.removeItem('y_roundStartTime');
            localStorage.removeItem('y_cardMatrices');

            window.location.reload();
        }

        function saveState() {
            localStorage.setItem('y_balance', balance);
            localStorage.setItem('y_soldCount', soldCount);
            localStorage.setItem('y_selectedCards', JSON.stringify(selectedCards));
            localStorage.setItem('y_calledBalls', JSON.stringify(calledBalls));
            localStorage.setItem('y_markedCellsState', JSON.stringify(markedCellsState));
        }
    </script>
</body>
</html>
